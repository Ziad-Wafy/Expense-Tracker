<section class="card border-0 shadow-sm rounded-4">
  <div class="card-body p-4">
    <div class="d-flex align-items-center mb-3">
      <span class="bot-icon me-2">✦</span>
      <div><h2 class="h5 mb-0">Your spending sidekick</h2><small class="text-secondary">Ask Ledgerly</small></div>
    </div>
    <div class="messages rounded-3 p-3 mb-3">
      @for (message of messages(); track $index) {
        <div class="d-flex mb-2" [class.justify-content-end]="message.from === 'user'">
          <div class="message px-3 py-2 rounded-3" [class.user-message]="message.from === 'user'">{{ message.text }}</div>
        </div>
      }
      @if (loading()) { <div class="text-secondary small"><span class="spinner-grow spinner-grow-sm me-2"></span>Thinking...</div> }
      @if (error()) { <div class="alert alert-danger py-2 mb-0" role="alert">{{ error() }}</div> }
    </div>
    <div class="input-group">
      <input class="form-control" aria-label="Message to Ledgerly" placeholder="Type a message..." [value]="draft()" (input)="draft.set($any($event.target).value)" (keydown.enter)="send()">
      <button class="btn btn-primary" type="button" (click)="send()" [disabled]="loading() || !draft().trim()">Send</button>
    </div>
  </div>
</section>
